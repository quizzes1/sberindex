# Настройки Streamlit (действуют и локально, и в Docker)

[server]
headless = true
port = 8501
fileWatcherType = "none"      # не перечитывать код на сервере
maxUploadSize = 5             # МБ; интерфейс ничего не загружает
enableXsrfProtection = true
enableStaticServing = true    # app/static/ → /app/static/: PDF и страницы отчёта/презентации на стартовой странице

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[runner]
fastReruns = true

# Шрифт Onest (открытая лицензия SIL OFL 1.1, app/static/fonts/OFL.txt) — раздаётся с нашего сервера,
# поэтому не зависит от доступности внешних сервисов шрифтов
[theme]
font = "Onest, sans-serif"
headingFont = "Onest, sans-serif"

[[theme.fontFaces]]
family = "Onest"
url = "app/static/fonts/Onest-Variable.ttf"
weight = "100 900"
style = "normal"

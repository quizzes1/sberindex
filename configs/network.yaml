# Параметры построения сети по умолчанию (src/network.py). Сеть строится на каждый год.
# Любой набор параметров получает хэш; рёбра сохраняются в data/networks/{hash}/.

seed: 42

sample:
  federal_districts: []         # [] — вся Россия (по умолчанию); пресеты: [ДФО], [СФО, ДФО] и т.п.
  regions: []                   # свой список кодов субъектов (если не пуст — вместо ФО)
  years: [2014, 2024]          # окно по умолчанию (решение команды); 2013 — нет темпа роста населения
  exclude_boundary_change: true   # МО, менявшие границы, исключены (как в отчёте): их показатели до и после
                                  # объединения несопоставимы

# Экономическое расстояние: признаки и веса a_k — набор из методологического отчёта (раздел 5). Отбор:
# покрытие ≥ 80% МО, без дублей (|ρ Спирмена| ≥ 0,8: ФОТ на жителя дублирует ВМП, все инвестиции — инвестиции без
# бюджета), заметный разброс после нормировки (специализация занятости и доля работников крупных и средних
# организаций исключены — дисперсия ~10⁻⁴), экономический смысл: продукт, доходы, капитал, промышленность,
# финансовая самостоятельность. Бюджетная самостоятельность в 2024 г. есть лишь у ~70% МО — в 2024 г. сеть меньше.
features:
  gmp_pc: 1.0               # ВМП на душу населения (оценка команды)
  wage: 1.0                 # среднемесячная зарплата
  invest_pc_nobudget: 1.0   # инвестиции на жителя без бюджетных средств
  shipped_pc: 1.0           # отгрузка на жителя
  budget_own_share: 1.0     # бюджетная самостоятельность (доля собственных доходов)

preprocess:
  log: registry          # registry — логарифм по реестру показателей; none — без логарифма
  method: minmax         # minmax | zscore
  scope: panel           # panel (по всем годам выборки) | year
  winsor: null           # например [0.01, 0.99]

metric: euclidean        # euclidean: sqrt(Σ a_k (x_ik − x_jk)² / Σ a_k) — сильнее реагирует на крупные различия
                         # по одному показателю; weighted_l1: D = Σ a_k |x_ik − x_jk| / Σ a_k
structural_missing: 0.5  # признак, который в году есть меньше чем у 50% МО (специализация занятости hhi_emp до 2017 г. —
                         # ни у одного МО), в этом году не участвует в расстоянии; в pooled такие МО-годы относятся к
                         # кластеру по имеющимся признакам
missing: drop            # drop — МО с пропуском хотя бы одного признака исключается в этом году (список — в stats);
                         # pairwise — по признакам, известным у обоих МО (веса перенормируются)

geo:
  alpha: 1.0             # D = α·D_econ + (1 − α)·D_geo; 1 — только экономика
  weights:               # веса географических компонентов (нормируются к сумме 1)
    road_km: 1.0         # по автодорогам (СберИндекс, граф OSM)
    rail_km: 0.0         # по железной дороге (СберИндекс, 2025)
    line_km: 0.0         # по прямой между центрами МО
    adjacency: 0.0       # 0 — общая граница, 1 — нет
  no_road: line          # МО без дорожной/ж-д связи: line — расстояние по прямой | adjacency — только смежность | exclude — без географии
  # времени в пути в данных СберИндекса нет (только км)

edge_weight: gaussian    # gaussian: w = exp(−D² / (2σ²)), σ — медиана ненулевых D;  inverse: w = 1 / (1 + D)

sparsify:
  method: knn_mst        # knn | threshold | knn_mst (kNN + минимальное остовное дерево → граф связный)
  k: 5                   # соседей у каждого МО (как в отчёте): средняя степень ~7, сеть связная
  knn_mode: symmetric    # symmetric (ребро, если j среди соседей i ИЛИ наоборот) | mutual (И)
  threshold: 0.5         # для method: threshold — оставить рёбра с w ≥ порога

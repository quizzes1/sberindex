# Сводные таблицы кластеров (этапы 5–6 доработки). Код — src/summary.py, страница «Сводные таблицы».

# ---------------------------------------------------------------- таблица 1 «Характерные признаки кластеров»
characteristic:
  # Признаки описания: признаки сети (configs/network.yaml → features) + дополнительные. Денежные — в ценах
  # базового года; логарифм — по реестру (как в сети). Пропуски не заполняются: среднее — по МО, где показатель есть.
  extra_features: [wage, retail_pc, old_age_share]
  # z-score признака считается по всем МО выборки за год таблицы (year) или по всем МО-годам окна (panel)
  z_scope: year
  thresholds:
    extreme: 1.0          # «максимальные» — кластер с наибольшим средним и z ≥ 1; «минимальные» — с наименьшим и z ≤ −1
    high: 0.5             # «высокие» — 0,5 ≤ z (и не максимум); «низкие» — z ≤ −0,5 (и не минимум); |z| < 0,5 — «средние»
  n_features: [3, 5]      # в описание — от 3 до 5 признаков с наибольшим |z|: все с |z| ≥ high, но не больше 5 и не меньше 3
  n_examples: 4           # примеры МО — крупнейшие по населению (3–5)

# Тексты, исправленные аналитиками, хранятся здесь (не затираются при пересчёте); при смене состава
# кластера страница предупреждает, что текст писался для другого состава.
descriptions_file: data/cluster_descriptions.yaml

# ---------------------------------------------------------------- таблица 2 «Результаты кластеризации по периодам»
periods:
  n_default: 3            # по умолчанию — 3 равноудалённых года окна (начало, середина, конец)
  # Траектория МО по выбранным периодам (номер кластера K: меньше — выше ВМП на душу в ценах базового года):
  # стабильный — один кластер во всех периодах; рост — номер только уменьшается (переход в кластер с более
  # высоким ВМП); снижение — только увеличивается; колебание — и то и другое. Периоды без метки (МО нет в
  # сети года) пропускаются; если метка есть меньше чем в двух периодах — «нет данных».
  trajectory_colors:
    стабильный: "#f0efec"
    рост: "#1baf7a"
    снижение: "#e34948"
    колебание: "#eda100"
    нет данных: "#ffffff"
  page_size: 50           # строк на странице таблицы уровня МО в интерфейсе

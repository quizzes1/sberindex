# Динамика кластеров и конвергенция. Код — src/dynamics.py, src/convergence.py.

seed: 42

# Какое разбиение анализировать по умолчанию (из data/clusters/{hash сети}/labels.parquet)
partition:
  # По умолчанию для динамики — одна модель на всю панель (решение команды):
  # типы общие для всех лет, смена типа = изменение показателей МО, а не перекластеризация года.
  # Покадровая кластеризация (per_year, в т.ч. KEFRiN и графовые методы) — для сравнения методов
  # и индексов качества по годам (reports/CLUSTERS.md).
  method: ward_kmeans  # Уорд → центроиды → k-means; для pooled — kmeans | ward | ward_kmeans | gmm
  k: 5                 # по умолчанию на всех страницах (решение команды); рекомендуемый диапазон 4–6: индексы и
                       # метод локтя по всей России 2014–2024 указывают на 4–5
  mode: pooled         # pooled | per_year

matching:
  # нумерация типов в режиме per_year: rank — место кластера по ВМП на душу внутри года (K1 — самый высокий),
  # одинаково на всех страницах (по умолчанию); jaccard — сопоставление соседних лет по мере Жаккара (номер
  # сохраняется за похожим кластером, возможны новые номера сверх k)
  numbering: rank
  min_jaccard: 0.2     # кластер года t+1 наследует сквозной номер, только если мера Жаккара ≥ порога

bootstrap:
  n: 50                # число повторов бутстрэпа по узлам
  frac: 1.0            # доля узлов в выборке (с возвращением)

convergence:
  # ряды: показатель из indicators_wide, либо ВМП конкретного метода (gmp.parquet). Денежные ряды хранятся
  # в текущих ценах и всегда пересчитываются в цены базового года (src/prices.py, дефлятор из реестра:
  # ВМП — дефлятор ВРП, зарплата и ФОТ — ИПЦ, инвестиции — индекс цен инвестиционной продукции);
  # конвергенцию по номинальным значениям не считаем.
  series:
    gmp_basic: {source: gmp, method: basic, column: gmp_pc, years: [2014, 2024],
                name: "ВМП на душу, реальный (базовый метод, единый для всего окна)"}
    gmp_sectoral: {source: gmp, method: sectoral, column: gmp_pc, years: [2017, 2024],
                   name: "ВМП на душу, реальный (отраслевой метод)"}
    wage: {source: indicators, column: wage, years: [2014, 2024], name: "Зарплата, реальная"}
    payroll_pc: {source: indicators, column: payroll_pc, years: [2014, 2024], name: "ФОТ на жителя, реальный"}
    invest_pc_nobudget: {source: indicators, column: invest_pc_nobudget, years: [2014, 2024],
                         name: "Инвестиции без бюджета на жителя, реальные"}
  samples: [Россия, ДФО]       # плюс каждый тип разбиения partition (на выборке по умолчанию — вся Россия)
  balanced: true               # β-регрессия: только МО с данными в начале и в конце окна
  min_years_reliable: 9        # при более коротком окне — предупреждение о ненадёжности
  phillips_sul: {trim: 0.3, hp_lambda: 400, crit: -1.65}

# Валовой муниципальный продукт (ВМП): параметры расчёта (src/gmp.py, scripts/build_gmp.py).
#
# Метод 1 (basic):    ВМП_i = ВРП_r × ФОТ_i / Σ_j ФОТ_j
# Метод 2 (sectoral): ВМП_i = Σ_k ВДС_{r,k} × s_ik,  s_ik = X_ik / Σ_j X_jk
#
# Индикаторы распределения X по разделам ОКВЭД2 (имена рядов панели):
#   shipped  — отгрузка товаров собственного производства по разделу (shipped__K)
#   agri     — продукция сельского хозяйства (agri_output; ряд до 2023 г.)
#   payroll  — отраслевой ФОТ (payroll__K)
#   pop      — население
# Если у индикатора в регионе-году нет ни одного МО с данными, используется fallback.

sectoral:
  default: payroll            # все разделы, не перечисленные ниже
  fallback: payroll           # если основной индикатор пуст в регионе-году
  by_section:
    A: agri                   # ВНИМАНИЕ: в ОКВЭД2 раздел A включает рыболовство (см. METHODS.md)
    B: shipped
    C: shipped
    D: shipped
    E: shipped
    L1: payroll               # операции с недвижимостью
    L2: payroll               # условная аренда собственного жилья; вариант — pop
    T: pop                    # домашние хозяйства как работодатели — по МО данных нет

# Скрытые Росстатом отраслевые значения. φ_r = доля ФОТ региона, не разложенная по разделам
# (Σ_i max(ФОТ_i − Σ_k ФОТ_ik, 0) / Σ_i ФОТ_i). Доля φ_r ВДС каждого раздела распределяется
# по МО пропорционально весу imputation_weight, остальное — по известным X_ik.
imputation_weight: residual_payroll   # residual_payroll | payroll | pop

# Годы: метод 2 — когда есть и ВДС по ОКВЭД2 субъектов, и ФОТ по ОКВЭД2 по МО (2017+).
sectoral_years: [2017, 2024]
basic_years: [2013, 2024]
default_method: sectoral     # для показателя gmp_pc; для лет без метода 2 берётся basic (флаг)

# Реальное выражение: дефлятор ВРП субъекта = (ВРП_t / ВРП_{t-1}) / (ИФО_t / 100), цепной
base_year: 2017

# Варианты для проверки чувствительности (переопределяют by_section / imputation_weight)
sensitivity:
  A_payroll: {by_section: {A: payroll}}
  BCDE_payroll: {by_section: {B: payroll, C: payroll, D: payroll, E: payroll}}
  L2_pop: {by_section: {L2: pop}}
  impute_pop: {imputation_weight: pop}
  impute_payroll: {imputation_weight: payroll}

# Агломерации: продукт = сумма ВМП входящих МО (territory_id)
agglomerations:
  Владивостокская: [775, 777, 794, 807, 778]   # Владивосток, Артём, Надеждинский, Шкотовский, Большой Камень
  Хабаровская: [842, 860]                      # Хабаровск, Хабаровский район
  Южно-Сахалинская: [1953, 1955, 1957]         # Южно-Сахалинск, Анивский, Корсаковский

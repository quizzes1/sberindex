[project]
name = "municipal-clustering"
version = "0.1.0"
description = "Данные и интерфейс для кластеризации муниципалитетов (конкурс СберИндекса, трек «Кластеризация»)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
